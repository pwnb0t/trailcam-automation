version: 1

# Cameras can be referenced by alias (e.g. --camera front).
cameras:
  back:
    ble_address: "C6:1E:0D:E0:0C:FB"
    ssid: "TrailCam_5DBD"
  front:
    ble_address: "C6:1E:0D:E0:09:25"
    ssid: "TrailCam_1D79"

# Client config values are used unless overridden on the CLI (where allowed).
client:
  wifi_ifname: "wlan0"
  # Optional: select BlueZ Bluetooth controller used for BLE wake.
  # Accepts either adapter name (hci0/hci1/...) or controller MAC.
  # Examples:
  # bluetooth_adapter: "hci0"
  # bluetooth_adapter: "8C:68:8B:83:07:DC"
  #bluetooth_adapter: "hci0"
  #bluetooth_adapter: "8C:68:8B:83:07:DC"
  udp_local_port: 16734

  page_item_cnt: 48
  list_max_pages: 200

  download_listen_s: 48.0
  download_idle_s: 4.0
  photo_download_retries: 3

  video_fps: 30
  strict_video: false

paths:
  # Staging area for raw downloads before organize/sync.
  staging_dir: "/mnt/trailcam/staging"
  # Final organized media root (used by sync/orchestration flow).
  final_media_dir: "/mnt/trailcam/media"
  tmp_dir: "out/tmp"

alerts:
  email:
    enabled: false
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    smtp_user: "your@gmail.com"
    smtp_app_password: "${TRAILCAM_GMAIL_APP_PASSWORD}"
    from_email: "your@gmail.com"
    to_emails:
      - "you@example.com"
    subject_prefix: "[TrailCam Sync]"
    starttls: true
    notify_on:
      - failure
