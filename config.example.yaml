version: 1

# Cameras can be referenced by alias (e.g. --camera front).
cameras:
  front:
    ble_address: "C6:1E:0D:E0:0C:FB"
    ssid: "TrailCam_5DBD"

# Defaults are used unless overridden on the CLI.
defaults:
  wifi_ifname: "wlan0"
  udp_local_port: 16734

  page_no: 0
  page_item_cnt: 45
  list_max_pages: 200

  download_listen_s: 45.0
  download_idle_s: 4.0

  video_fps: 30

paths:
  # When /mnt/trailcam is mounted (piiter), write final media directly to NAS.
  media_out_dir: "/mnt/trailcam/staging"
  tmp_dir: "out/tmp"
